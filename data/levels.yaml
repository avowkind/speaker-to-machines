# yaml-language-server: $schema=../site/schemas/levels.schema.json
framework:
  name: Speaker-to-Machines
  subtitle: an AI skills logbook
  version: "0.1"
  licence: CC BY-SA 4.0
  title_note: >-
    Level titles follow the Kzin naming custom in Larry Niven's Known Space stories, where titles
    and names are earned by deeds. Here too, a level is earned through evidence, not claimed.
levels:
  - level: 1
    name: Aware
    title: Listener
    mode: know
    description: >-
      Can explain what it is, what it is for and its main limits. Has tried it with guidance or seen
      it demonstrated.
    evidence: An explanation, a course completed, a demonstration seen.
  - level: 2
    name: Assisted
    title: Caller
    mode: use
    description: >-
      Uses it for simple, well-defined tasks by following examples, templates or instructions. Spots
      obvious failures.
    evidence: Occasional use with visible output.
  - level: 3
    name: Practitioner
    title: Speaker
    mode: use
    description: >-
      Uses it routinely and independently in own work. Decides when to use it and when not to,
      checks results and handles the common failure modes.
    evidence: Regular work product over months.
  - level: 4
    name: Integrator
    title: Shaper
    mode: build
    description: >-
      Adapts and combines techniques into repeatable workflows for self and team. Configures,
      customises and troubleshoots, and helps others adopt.
    evidence: Reusable workflows, configurations, guidance written for others.
  - level: 5
    name: Designer
    title: Maker
    mode: build
    description: >-
      Designs and builds solutions that other people rely on. Balances quality, cost, risk and
      security. Sets team practice and reviews others' work.
    evidence: Systems in use, design documents, reviews.
  - level: 6
    name: Authority
    title: Keeper
    mode: lead
    description: >-
      Recognised authority across an organisation. Sets strategy, standards and policy, and is
      accountable for outcomes and risk at scale.
    evidence: Policies, strategies and standards adopted by the organisation.
  - level: 7
    name: Field shaper
    title: Namer
    mode: lead
    description: >-
      Advances practice beyond one organisation through research, widely adopted tools, protocols or
      standards. Names the things others go on to use.
    evidence: Publications, widely used open work, standards contributions.
retired: []
